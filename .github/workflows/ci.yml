# OpenDoor CI – SIA documentation section 8.4.
# Validate & test: one job per component, run only when that component (or this file) changed.
# Every run of the workflow by hand (Actions → CI → Run workflow) runs all jobs.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PHP_VERSION: '8.4'

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      gateway: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.gateway == 'true' }}
      insights: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.insights == 'true' }}
      core: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' }}
      registry: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.registry == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            frontend:
              - *workflow
              - 'frontend/**'
            gateway:
              - *workflow
              - 'gateway/**'
            insights:
              - *workflow
              - 'services/insights-service/**'
            core:
              - *workflow
              - 'services/core-api/**'
            registry:
              - *workflow
              - 'services/business-registry-soap/**'

  frontend:
    name: Frontend (oxlint, Vitest, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8080/api

  gateway:
    name: Gateway (ESLint, Jest)
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  insights:
    name: Insights Service (ESLint, Jest + nock)
    needs: changes
    if: needs.changes.outputs.insights == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/insights-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/insights-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  core:
    name: Core Service (Pint, PHPUnit on MySQL)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: opendoor_core_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # Override phpunit.xml's SQLite (PHPUnit keeps variables that are already set).
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: opendoor_core_test
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, soap, mbstring, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('services/core-api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test

  registry:
    name: Business Registry (php -l, xmllint WSDL, SOAP smoke)
    needs: changes
    if: needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/business-registry-soap
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: soap, dom, pdo_sqlite
          coverage: none
          tools: none
      - name: Install xmllint
        run: command -v xmllint || (sudo apt-get update && sudo apt-get install -y libxml2-utils)
      - name: PHP syntax
        run: find . -name '*.php' -not -path './data/*' -print0 | xargs -0 -n1 php -l
      - name: WSDL is well-formed XML
        run: xmllint --noout --nonet wsdl/*.wsdl
      - name: Unit + SOAP smoke tests
        run: php tests/run.php
