openapi: 3.1.0
info:
  title: OpenDoor API
  version: 0.1.0-draft
  summary: PWD job matching by workplace accommodations, with verification after the employer reaches out.
  description: |
    Public API exposed by the OpenDoor API Gateway. The React client only calls these paths.
    The gateway routes `/api/insights/*` to the Insights Service and every other `/api/*` path to the Core Service.
    `/internal/*` paths are service-to-service only and are **never** routed by the gateway (404).

    **Errors** use one envelope everywhere (`Error`); 422 validation errors add Laravel's `errors` object (`ValidationError`).
    Every response carries an `X-Request-ID` header (UUID v4) that also appears as `error.request_id`.

    **Lists** are paginated, 12 per page (`?page=`).

    Draft generated from the SIA documentation (section 4 and Appendix A). Keep it identical to
    `.claude/skills/opendoor-dev/references/api-contract.md`; once implementation starts, this file wins.
servers:
  - url: http://localhost:8080/api
    description: Local gateway
  - url: https://{gateway}/api
    description: Production gateway (Railway)
    variables:
      gateway:
        default: opendoor-gateway.up.railway.app
tags:
  - name: Gateway
  - name: M1 Auth
  - name: M2 Candidate profile
  - name: M3 Company
  - name: M4 Job postings
  - name: M5 Search and matching
  - name: M6 Applications
  - name: M7 Feedback and trust score
  - name: M8 Dashboards
  - name: M9 Notifications
  - name: M10 Moderation
  - name: M11 Master data
  - name: M12 Saved jobs
  - name: M13 Accessibility settings
  - name: Insights
  - name: Internal
security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- Gateway
  /health:
    get:
      tags: [Gateway]
      summary: Gateway health with downstream service status
      security: []
      responses:
        '200':
          description: Gateway is up (services may be degraded)
          content:
            application/json:
              schema:
                type: object
                required: [status, services]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  services:
                    type: object
                    properties:
                      core: { $ref: '#/components/schemas/ServiceHealth' }
                      insights: { $ref: '#/components/schemas/ServiceHealth' }

  # ---------------------------------------------------------------- M1 Auth
  /register:
    post:
      tags: [M1 Auth]
      summary: Register a candidate or employer (admins never self-register)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, role, consent]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
                role: { type: string, enum: [candidate, employer] }
                consent:
                  type: boolean
                  const: true
                  description: Data privacy consent (RA 10173); stored as `consented_at`.
      responses:
        '201':
          description: Registered and logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /login:
    post:
      tags: [M1 Auth]
      summary: Log in and receive a Sanctum token (5 attempts per minute)
      description: Wrong email or password → 422 with `errors.email` (same answer for unknown emails). A suspended account → 403 `ACCOUNT_SUSPENDED`, only after the password is correct. Limit is per email + IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /forgot-password:
    post:
      tags: [M1 Auth]
      summary: Email a link to reset the password (5 requests per minute)
      description: |
        Always 200 with the same message, whatever the email. Every request only queues a job (the same small
        work for every email), so neither the answer nor its timing reveals which emails have an account. The job
        (database queue, worked every minute by the scheduler) sends an active account an email within about a
        minute, with a link to the React page `{PUBLIC_APP_URL}/reset-password?token=…&email=…`, valid 60 minutes
        and once. Suspended accounts get no link. A second request for the same account within 60 seconds sends nothing new. The email is sent even when
        the user turned notification emails off (security email). Limit is per email + IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 255 }
      responses:
        '200':
          description: The same answer for every email
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: 'If an account exists for this email, we sent a link to reset the password.' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /reset-password:
    post:
      tags: [M1 Auth]
      summary: Set a new password with the emailed link (5 requests per minute)
      description: |
        `token` and `email` come from the link. Success signs the user out on every device (all tokens revoked);
        the user then logs in with the new password. A wrong, used or expired token, or an email without an
        account → 422 with `errors.token` (one message for all, so no account is revealed).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: 'Your password is changed. Log in with your new password.' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /logout:
    post:
      tags: [M1 Auth]
      summary: Revoke the current token
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /me:
    get:
      tags: [M1 Auth]
      summary: Current user and role
      responses:
        '200':
          description: Current user, with the M13 display settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /me/password:
    put:
      tags: [M1 Auth]
      summary: Change password
      description: New password must differ from the current one. All of the user's other tokens are revoked; the token used for this request stays valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '204': { description: Password changed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /me/display-prefs:
    put:
      tags: [M13 Accessibility settings]
      summary: Save the display settings with the account
      description: Any role. Replaces all three settings; they follow the user to other devices (returned by GET /me and login). The client also keeps a copy in the browser for guests.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisplayPrefs' }
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisplayPrefs' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /me/email-notifications:
    put:
      tags: [M13 Accessibility settings]
      summary: Turn the emails for notifications on or off
      description: |
        Candidates and employers (administrators receive no notifications → 403). On by default for every
        account. When on, each in-app notification (see Notification.type) is also emailed after the response:
        the notice text and a link to the same page in the app – never disability or accommodation-need
        details. Suspended accounts get no email. A mail server failure is logged and never fails the action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Saved choice
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /me/onboarding:
    patch:
      tags: [M1 Auth]
      summary: Remember the welcome tour and the "Get started" list
      description: |
        Candidates and employers (administrators have no onboarding → 403). A new account starts with
        `tour_done` and `checklist_hidden` false: the client shows the welcome tour after the first sign-in
        and a "Get started" list on the dashboard (its steps come from the user's own data). Partial update:
        send one or both fields; `checklist_hidden: false` shows the list again. Accounts that existed before
        onboarding was added, and the demo accounts, start as done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                tour_done: { type: boolean }
                checklist_hidden: { type: boolean }
      responses:
        '200':
          description: The saved onboarding state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Onboarding' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- M2 Candidate profile
  /candidate/profile:
    get:
      tags: [M2 Candidate profile]
      summary: Own candidate profile including accommodation needs
      description: >-
        A new candidate gets an empty profile (created on first access) – this endpoint never answers 404.
        `profile_complete` / `profile_missing` say what is still needed before the dashboard and applying.
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [M2 Candidate profile]
      summary: Update own candidate profile
      description: >-
        Partial update – omitted fields keep their value. Empty strings are stored as null. show_disability is forced to false
        when disability_type is null. Skills that match a name or other spelling in the skills list are stored under the list
        name; duplicates (any spelling) are dropped. A changed location_psgc is looked up in the Insights Service for its centre
        point (never blocks saving).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CandidateProfileInput' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateProfile' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /candidate/accommodations:
    put:
      tags: [M2 Candidate profile]
      summary: Replace the candidate's accommodation needs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accommodation_ids]
              properties:
                accommodation_ids:
                  type: array
                  maxItems: 30
                  uniqueItems: true
                  description: Active accommodation types; a type retired after it was chosen may be kept. An empty array clears all needs.
                  items: { type: integer }
      responses:
        '200':
          description: Saved needs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Accommodation' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /candidate/resume:
    post:
      tags: [M2 Candidate profile]
      summary: Upload résumé (PDF only, max 5 MB)
      description: Replaces (and deletes) the previous résumé.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [resume]
              properties:
                resume: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  resume_url: { type: string, description: 'Signed gateway link, valid 30 minutes (see GET /resumes/{id})' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /candidate/resume/skill-suggestions:
    get:
      tags: [M2 Candidate profile]
      summary: Skills from the skills list found in the uploaded résumé (Decision 2026-10-21)
      description: >-
        The text of the first 10 pages is read in Core and never stored. Returns list names (and other spellings of 4+
        letters that are not common words) found as whole words, minus the skills already on the profile. Only suggestions:
        the candidate adds the right ones with PUT /candidate/profile.
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [readable, skills]
                    properties:
                      readable: { type: boolean, description: false when no text could be read (for example a scanned PDF) }
                      skills: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No résumé uploaded yet ("Upload your résumé first.")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /resumes/{id}:
    get:
      tags: [M2 Candidate profile]
      summary: Open a résumé PDF from a temporary signed link
      description: >-
        No Bearer token (the browser opens the link in a new tab); access is granted by the signature instead.
        Links come only from the API (resume_url, valid 30 minutes). The signature covers path and query
        (relative), so the gateway forwards the request unchanged.
      security: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: expires, in: query, required: true, schema: { type: integer }, description: Unix timestamp }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: PDF (Content-Disposition inline, Cache-Control private, no-store)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- M3 Company
  /employer/company:
    get:
      tags: [M3 Company]
      summary: Own company profile
      responses:
        '200':
          description: Company
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [M3 Company]
      summary: Create or update own company profile (changing business_reg_no clears verification)
      description: GET answers 404 until the profile exists. With a logo the body is multipart; clients send it as POST with `_method=PUT` (Laravel method spoofing).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CompanyInput' }
          application/json:
            schema: { $ref: '#/components/schemas/CompanyInput' }
      responses:
        '200':
          description: Saved company
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /employers/{id}:
    get:
      tags: [M3 Company]
      summary: Public employer page (company, verified badge, open postings, trust score)
      security: []
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Public employer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EmployerPublic'
                  - type: object
                    properties:
                      open_postings:
                        type: array
                        items: { $ref: '#/components/schemas/JobPosting' }
        '404': { $ref: '#/components/responses/NotFound' }
  /employers/{id}/logo:
    get:
      tags: [M3 Company]
      summary: Company logo image (served through the gateway; the client never calls Core directly)
      security: []
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Image (PNG, JPEG or WebP), Cache-Control public 1 day
          content:
            image/*:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/employers:
    get:
      tags: [M3 Company]
      summary: Employer verification queue (admin)
      parameters:
        - name: status
          in: query
          description: pending = not verified and not rejected
          schema: { type: string, enum: [pending, verified, rejected], default: pending }
        - name: q
          in: query
          description: Company name or registration number
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Employers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminEmployer' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/employers/{id}:
    get:
      tags: [M3 Company]
      summary: One employer with owner and latest registry check (admin)
      description: >-
        `latest_registry_check` is the newest check for the registration number and type on file;
        it is null when the employer changed them after the last check.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Employer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminEmployer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/employers/{id}/verify:
    patch:
      tags: [M3 Company]
      summary: Run a SOAP registry check, or approve / reject an employer
      description: |
        `check` calls the legacy Business Registry (SOAP) and stores a `registry_checks` row.
        The registry result never approves automatically; the admin decides with `approve` or `reject`.
        `reject` on a verified employer removes the badge ("Remove verification"); the reason is shown to the employer.
        A registry that cannot answer (Server fault, connection error, 5 s timeout) is stored as an `ERROR` check and
        answered with 502 REGISTRY_UNAVAILABLE; credential problems (502 REGISTRY_AUTH_FAILED) and input the registry
        refuses (422 REGISTRY_INVALID_REQUEST, message includes the registry's reason) store nothing.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [check, approve, reject] }
                reason: { type: string, description: Required when action is reject }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  registry:
                    description: The new check (`check`), or the current one for approve/reject (null if none)
                    oneOf:
                      - $ref: '#/components/schemas/RegistryResult'
                      - type: 'null'
                  verified_at: { type: [string, 'null'], format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502': { $ref: '#/components/responses/RegistryError' }

  # ---------------------------------------------------------------- M4 Job postings
  /employer/job-postings:
    get:
      tags: [M4 Job postings]
      summary: Own postings (all statuses) with applicant counts
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/JobPostingStatus' }
      responses:
        '200':
          description: Own postings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/JobPosting'
                        - type: object
                          properties:
                            applicants_count: { type: integer }
                  meta: { $ref: '#/components/schemas/PageMeta' }
  /job-postings:
    get:
      tags: [M5 Search and matching]
      summary: Search open postings; "Recommended for me" ranking for candidates
      description: >-
        Only open, approved postings of verified employers that are not suspended. A logged-in candidate with a profile gets
        `match` (score from skills, location, qualifications, work preferences and accommodation needs – Decision 2026-10-21)
        on every posting (also with match=0); `meta.match_mode` is true only when match=1 is asked by such a candidate –
        for guests and other roles match=1 is ignored (not an error). The disability type is never used.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          description: Keyword, case-insensitive substring of title, description or company name (% and _ are literal)
          schema: { type: string, maxLength: 100 }
        - name: category
          in: query
          schema: { type: integer }
        - name: accommodations[]
          in: query
          description: The posting must offer every listed accommodation
          style: form
          explode: true
          schema:
            type: array
            maxItems: 30
            items: { type: integer }
        - name: work_setup[]
          in: query
          description: Only these work setups (any of them)
          style: form
          explode: true
          schema:
            type: array
            maxItems: 3
            items: { $ref: '#/components/schemas/WorkSetup' }
        - name: distance
          in: query
          description: >-
            Kilometres from the candidate's city centre (straight line, city centre to city centre); remote postings are
            always kept and postings without a known point are left out. Ignored (meta.distance null) for guests, other
            roles and candidates whose city has no known point yet.
          schema: { type: integer, enum: [10, 25, 50, 100] }
        - name: match
          in: query
          description: 1 = rank by the logged-in candidate's match score (highest first, then by `sort`)
          schema: { type: integer, enum: [0, 1] }
        - name: sort
          in: query
          description: best = match score (match mode), then newest; newest = created_at desc; closing = closes_at asc. Ties by id desc.
          schema: { type: string, enum: [best, newest, closing], default: best }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Postings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/JobPosting' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/PageMeta'
                      - type: object
                        properties:
                          match_mode: { type: boolean }
                          distance: { type: [integer, 'null'], description: The distance filter that was applied (km), or null }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [M4 Job postings]
      summary: Create a posting (draft, or publish)
      description: >-
        Requires the employer's company profile (otherwise 422 with `errors.company`). `submit` defaults to false (draft).
        `submit: true` publishes at once (status open) – only for a verified company (otherwise 422 `errors.submit`) and
        with at least one skill (422 `errors.skills`). There is no admin approval step (Decision 2026-10-21).
        Skills that match a name or other spelling in the skills list are stored under the list name. Accommodation types must be active.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobPostingInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPosting' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /job-postings/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [M5 Search and matching]
      summary: Posting details (+ `match` for candidates)
      description: Public for open, approved postings of verified employers. Owners and admins also see their other statuses; for anyone else an unpublished posting is 404 (its existence is not revealed).
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Posting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPosting' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [M4 Job postings]
      summary: Update own posting
      description: "`submit: true` publishes the posting with the changes (status open, also for an open or closed one) and clears an old `rejection_reason`; only a verified company may publish (otherwise 422 `errors.submit`). `submit: false` is only allowed while the posting is a draft (otherwise 422 `errors.submit`). An accommodation type retired after it was attached may stay."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobPostingInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPosting' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [M4 Job postings]
      summary: Soft-delete own posting
      description: The posting leaves search and the employer page; applications already received are kept.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /job-postings/{id}/status:
    patch:
      tags: [M4 Job postings]
      summary: Open or close own posting
      description: open → closed at any time; closed → open only for a published posting of a verified company and before the closing date has passed. Other changes → 422 `errors.status`. A daily job (`postings:close-expired`, 00:05 Asia/Manila) closes open postings after `closes_at`.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, closed] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPosting' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/job-postings:
    get:
      tags: [M4 Job postings]
      summary: Every posting, or one status (admin)
      description: Newest first. Postings are published without approval (Decision 2026-10-21); admins remove inappropriate ones.
      parameters:
        - name: status
          in: query
          description: Omit for every status
          schema: { $ref: '#/components/schemas/JobPostingStatus' }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Postings (with description, accommodations and notes)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/JobPosting' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/job-postings/{id}:
    delete:
      tags: [M4 Job postings]
      summary: Remove a posting (admin)
      description: >-
        Any status. Soft delete: applications and feedback are kept. The employer gets a `posting_review`
        notice with `removed: true` and the reason. An already removed or unknown posting is 404.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- M6 Applications
  /job-postings/{id}/applications:
    post:
      tags: [M6 Applications]
      summary: Apply to an open posting
      description: >-
        Candidates only, with a complete profile (otherwise 422 PROFILE_INCOMPLETE – Decision 2026-10-21) and a résumé
        on file (otherwise 422 RESUME_REQUIRED – Decision 2026-10-22b; upload it first with POST /candidate/resume). A draft or unpublished posting is 404; a closed posting, or an open one past its
        `closes_at` day (Asia/Manila), is 422 POSTING_CLOSED; a second application to the same posting is
        409 ALREADY_APPLIED. A candidate without a profile gets an empty one. The employer is notified.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cover_note: { type: string, maxLength: 2000 }
                interview_request: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Applied (status pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /applications:
    get:
      tags: [M6 Applications]
      summary: Own applications (candidate) or applications to own postings (employer)
      description: Candidates and employers only (admins 403). Newest first; applications to deleted postings stay listed.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ApplicationStatus' }
        - name: job_posting_id
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Application' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /applications/{id}:
    get:
      tags: [M6 Applications]
      summary: Application details (employer opening a pending application marks it reviewed)
      description: Only the candidate who applied and the employer that owns the posting; anyone else gets 403.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /applications/{id}/status:
    patch:
      tags: [M6 Applications]
      summary: Change application status (see the status workflow)
      description: |
        Stages (Decision 2026-10-22b): Submitted (pending) → Under review (reviewed) → Shortlisted →
        Contacted → Hired. The employer may skip stages forward: pending→reviewed (also automatic when
        the employer opens it), pending/reviewed→shortlisted, pending/reviewed/shortlisted→contacted;
        reviewed/shortlisted/contacted→rejected (employer); pending/reviewed/shortlisted/contacted→withdrawn
        (candidate). Each stage sets its date (`reviewed_at`, `shortlisted_at`, `contacted_at`); a skipped
        stage keeps none. `hired` is never set here (422 INVALID_STATUS_TRANSITION): only a confirmed
        hiring report makes an application hired. Anything else → 422 INVALID_STATUS_TRANSITION.
        A withdrawal or rejection cancels a pending hiring report. Every change notifies the other party.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [reviewed, shortlisted, contacted, rejected, withdrawn] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /applications/{id}/hiring-reports:
    post:
      tags: [M6 Applications]
      summary: Report a hire (employer "Report hiring", candidate "Report that I was hired")
      description: |
        Decision 2026-10-22b: hired only by mutual confirmation. Either party reports the hire with a
        proposed start date; the other party is notified and answers with POST …/response. Never
        confirmed automatically. Only while the application is in progress (pending, reviewed,
        shortlisted, contacted – also when the job closed), otherwise 422 INVALID_STATUS_TRANSITION;
        one pending report per application (409 HIRING_REPORT_PENDING). `start_date`: from the
        application date up to 365 days ahead.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date]
              properties:
                start_date: { type: string, format: date, example: '2026-11-03' }
      responses:
        '201':
          description: Reported (the application with its hiring_reports; the stage is unchanged)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /applications/{id}/hiring-reports/{reportId}/response:
    post:
      tags: [M6 Applications]
      summary: Answer the other party's hiring report (Confirm, Not yet, Incorrect)
      description: |
        Only the party that did not report (the reporter → 403 FORBIDDEN). `confirm`: the report is
        confirmed and the application becomes hired ("Hired — confirmed"): `hired_at` = now,
        `hire_start_date` = the report's start date, the promised accommodations are recorded and the
        rating opens 30 days after the start date. `not_yet`: the report stays pending; an optional
        `start_date` replaces the proposed one. `incorrect`: the report is disputed and the stage stays
        as it is (a new report can be made). An answered or cancelled report → 409 HIRING_REPORT_CLOSED.
        The reporter is notified. A report of another application → 404.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: reportId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, enum: [confirm, not_yet, incorrect] }
                start_date: { type: string, format: date, description: Only with not_yet (otherwise 422) }
      responses:
        '200':
          description: Answered (the application with its hiring_reports)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- M7 Feedback
  /applications/{id}/feedback-form:
    get:
      tags: [M7 Feedback and trust score]
      summary: Accommodations to rate (those advertised when the hire was confirmed)
      description: >-
        Only the candidate of a hired application. The items are the accommodations the posting
        advertised when the hire was confirmed (recorded then; later posting edits do not
        change them), sorted by name. An application that is not hired → 422 FEEDBACK_NOT_OPEN.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Form
          content:
            application/json:
              schema:
                type: object
                properties:
                  opens_on: { type: string, format: date, description: Calendar day 30 after the confirmed start date (Asia/Manila) }
                  is_open: { type: boolean }
                  submitted: { type: boolean, description: The candidate has already rated this job }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        accommodation_id: { type: integer }
                        name: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /applications/{id}/feedback:
    post:
      tags: [M7 Feedback and trust score]
      summary: Submit feedback once, from calendar day 30 after the confirmed start date (Asia/Manila)
      description: >-
        Only the candidate of a hired application. Not hired or before `opens_on` → 422
        FEEDBACK_NOT_OPEN; a second response → 409 FEEDBACK_EXISTS. Every item of the feedback form
        needs exactly one rating (`errors.items` when one is missing; an accommodation that is not on
        the form → `errors["items.N.accommodation_id"]`). Recomputes the employer's trust score.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [accommodation_id, rating]
                    properties:
                      accommodation_id: { type: integer }
                      rating: { $ref: '#/components/schemas/FeedbackRating' }
                comments: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  application_id: { type: integer }
                  items_rated: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /employers/{id}/trust-score:
    get:
      tags: [M7 Feedback and trust score]
      summary: Employer trust score (published only from 3 responses)
      description: >-
        Same answer for everyone. Below 3 non-hidden responses `published` is false, `score` null and
        `breakdown` empty (a breakdown of one or two responses would reveal single answers).
        Responses to soft-deleted postings still count; hidden responses do not.
      security: []
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Trust score
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustScore' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- M8 Dashboards
  /candidate/dashboard:
    get:
      tags: [M8 Dashboards]
      summary: Candidate summary (applications by status, matches, pending feedback)
      description: |
        Counts are zero-filled for every status; `pipeline` is what the stage tiles show. `matching_jobs` = visible postings offering every saved need (0 without needs).
        `feedback_due` = hired applications not rated yet, earliest start date first (also those whose window is not open yet).
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateDashboard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /employer/dashboard:
    get:
      tags: [M8 Dashboards]
      summary: Employer summary (postings, applicants, trust score, verification)
      description: |
        Postings exclude deleted ones (as the postings list); applications include those to deleted postings (as the applicants list).
        Without a company: `exists:false`, zero counts and an unpublished trust score.
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployerDashboard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/dashboard:
    get:
      tags: [M8 Dashboards]
      summary: Admin analytics (users, postings, verification queue, reports)
      description: Postings deleted by their employer, and applications to them, are left out. `verification_queue` uses the same rule as `GET /admin/employers?status=pending`.
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- M9 Notifications
  /notifications:
    get:
      tags: [M9 Notifications]
      summary: Own notifications (unread count in meta)
      description: Candidates and employers only (admins receive none – 403). Newest first, 12 per page; `meta.unread_count` counts all unread notifications.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/PageMeta'
                      - type: object
                        properties:
                          unread_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications/{id}/read:
    patch:
      tags: [M9 Notifications]
      summary: Mark one notification read
      description: Another user's or an unknown id is 404. Marking it again keeps the first `read_at`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Marked read }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/read-all:
    patch:
      tags: [M9 Notifications]
      summary: Mark all notifications read
      responses:
        '204': { description: Marked read }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- M10 Moderation
  /admin/users:
    get:
      tags: [M10 Moderation]
      summary: List users
      description: Sorted by name, 12 per page. `q` matches name or email (case-insensitive, `%` and `_` literal).
      parameters:
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/users/{id}/suspend:
    patch:
      tags: [M10 Moderation]
      summary: Suspend (revokes all tokens) or reactivate a user
      description: A suspended user is signed out everywhere and gets ACCOUNT_SUSPENDED on login. Admins cannot suspend themselves (422 `errors.suspended`).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /job-postings/{id}/reports:
    post:
      tags: [M10 Moderation]
      summary: Report a posting
      description: |
        Candidates only. The posting must be visible (open, approved, not deleted), else 404.
        One open report per candidate and posting (422 `errors.reason`); after an admin resolves it the candidate may report again.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Reported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/reports:
    get:
      tags: [M10 Moderation]
      summary: List reports
      description: '`status=open` is a queue (oldest first); any other filter or none lists newest first. 12 per page.'
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReportStatus' }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Report' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/reports/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [M10 Moderation]
      summary: Report details
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [M10 Moderation]
      summary: Dismiss or act on a report
      description: Only open reports (422 `errors.status` once resolved). Records the admin and the time; closing the posting or suspending the employer are separate actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [dismissed, actioned] }
                note: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/feedback:
    get:
      tags: [M10 Moderation]
      summary: Feedback responses for moderation (anonymous – no author)
      description: Newest first, 12 per page.
      parameters:
        - name: employer_id
          in: query
          schema: { type: integer }
        - name: hidden
          in: query
          schema: { type: integer, enum: [0, 1] }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Feedback responses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminFeedback' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/feedback/{id}/hide:
    patch:
      tags: [M10 Moderation]
      summary: Hide or unhide a feedback response (recomputes the trust score)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden: { type: boolean }
      responses:
        '204': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------------------------------------------------------------- M11 Master data
  /categories:
    get:
      tags: [M11 Master data]
      summary: Job categories
      security: []
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
  /skills:
    get:
      tags: [M11 Master data]
      summary: The shared skills list with other spellings (Decision 2026-10-21)
      description: Sorted by name, ignoring case. Candidates and employers pick from it or type their own skills.
      security: []
      responses:
        '200':
          description: Skills
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string, example: Microsoft Excel }
                        aliases: { type: array, items: { type: string }, example: [Excel, MS Excel] }
  /accommodations:
    get:
      tags: [M11 Master data]
      summary: Accommodation types grouped (retired ones excluded)
      security: []
      responses:
        '200':
          description: Accommodations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        group: { $ref: '#/components/schemas/AccommodationGroup' }
                        label: { type: string }
                        items:
                          type: array
                          items: { $ref: '#/components/schemas/Accommodation' }
  /admin/categories:
    post:
      tags: [M11 Master data]
      summary: Create category
      requestBody: { $ref: '#/components/requestBodies/CategoryInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/categories/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [M11 Master data]
      summary: Update category
      requestBody: { $ref: '#/components/requestBodies/CategoryInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
    delete:
      tags: [M11 Master data]
      summary: Delete category (only if unused)
      description: A category still referenced by job postings → 422 with `errors.category`.
      responses:
        '204': { description: Deleted }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/accommodations:
    get:
      tags: [M11 Master data]
      summary: All accommodation types, including retired ones (admin list for restoring)
      responses:
        '200':
          description: Accommodations ordered by id
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Accommodation' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [M11 Master data]
      summary: Create accommodation type
      requestBody: { $ref: '#/components/requestBodies/AccommodationInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accommodation' }
  /admin/accommodations/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [M11 Master data]
      summary: Update accommodation type
      requestBody: { $ref: '#/components/requestBodies/AccommodationInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accommodation' }
    delete:
      tags: [M11 Master data]
      summary: Delete if unused, otherwise retire (is_retired = true)
      responses:
        '200':
          description: Retired (was in use)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accommodation' }
        '204': { description: Deleted }

  # ---------------------------------------------------------------- M12 Saved jobs
  /candidate/saved-jobs:
    get:
      tags: [M12 Saved jobs]
      summary: Saved postings
      description: >-
        Own bookmarks of visible postings (open, approved, not deleted), most recently saved first, 12 per page.
        Each posting has `saved: true` and, for candidates with saved needs, `match`. A bookmark on a posting
        that closes is kept and shows again if the posting reopens.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Saved postings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/JobPosting' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /candidate/saved-jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [M12 Saved jobs]
      summary: Save a posting
      description: Idempotent. Only visible postings; drafts, pending, closed, deleted and unknown ids are 404.
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPosting' }
        '200':
          description: Was already saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPosting' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [M12 Saved jobs]
      summary: Remove a saved posting
      description: Idempotent, by id – also removes a bookmark whose posting has closed or been deleted; 204 when nothing was saved.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Insights (routed to Insights Service)
  /insights/job-postings/{id}:
    get:
      tags: [Insights]
      summary: Workplace Accessibility Snapshot (mashup of Core, PSGC, Nominatim, Overpass)
      description: |
        Returns 200 even when PSGC, Nominatim or Overpass fail; see `sources`. Only the Core Service
        is required. The snapshot is answered within about 12 s: a source still running then is
        reported as `unavailable` (its answer still fills the cache for the next request).
        `stale` for `psgc` also covers the bundled fallback lists.
      security: []
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snapshot' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: SERVICE_UNAVAILABLE (the Core Service did not answer or refused the service key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /insights/locations/{level}:
    get:
      tags: [Insights]
      summary: PSGC location lists for pickers
      description: |
        Official 10-digit PSGC codes, sorted by name. Lists are cached 7 days. When PSGC is down,
        an expired cache entry is served, else a bundled list (all regions and provinces, NCR, and
        the cities of each province); a list that is neither cached nor bundled is 503.
        Unknown levels are 404.
      security: []
      parameters:
        - name: level
          in: path
          required: true
          schema: { type: string, enum: [regions, provinces, cities] }
        - name: parent
          in: query
          description: |
            Required for provinces and cities (ignored for regions). Region code (for provinces, or
            for the cities of a region without provinces such as NCR) or province code (for cities).
          schema: { type: string, pattern: '^\d{10}$', example: '1300000000' }
      responses:
        '200':
          description: Locations
          headers:
            X-Data-Source:
              description: Where the list came from
              schema: { type: string, enum: [ok, cached, stale, fallback] }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LocationItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503':
          description: SERVICE_UNAVAILABLE (PSGC down and the list is neither cached nor bundled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- Internal (not routed by gateway)
  /internal/job-postings/{id}/summary:
    servers:
      - url: http://localhost:8001
        description: Core Service directly (private network only)
    get:
      tags: [Internal]
      summary: Posting summary for the Insights Service (service key only; 404 if not open)
      security: [{ serviceKey: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalPostingSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/places/{code}:
    servers:
      - url: http://localhost:8002
        description: Insights Service directly (private network only)
    get:
      tags: [Internal]
      summary: City or municipality with province/region codes and centre point, for Core (Decision 2026-10-21)
      description: >-
        Called by Core when a profile's or posting's location changes, and by `locations:resolve` every 15 minutes for
        missing points. The point comes from the geocode cache, Nominatim ("City, Province") or the bundled city centroids;
        lat/lon are null when none knows the place.
      security: [{ serviceKey: [] }]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^\d{10}$' }
      responses:
        '200':
          description: Place
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  city: { type: string }
                  province: { type: [string, 'null'] }
                  region: { type: string }
                  province_code: { type: [string, 'null'], description: null in NCR }
                  region_code: { type: string }
                  lat: { type: [number, 'null'] }
                  lon: { type: [number, 'null'] }
                  precision: { type: [string, 'null'], enum: [city, null] }
                  sources:
                    type: object
                    properties:
                      psgc: { $ref: '#/components/schemas/SourceStatus' }
                      geocode: { $ref: '#/components/schemas/SourceStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: PSGC lists unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }

  requestBodies:
    CategoryInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, maxLength: 100 }
    AccommodationInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, group]
            properties:
              name: { type: string, maxLength: 150 }
              group: { $ref: '#/components/schemas/AccommodationGroup' }
              description: { type: [string, 'null'] }
              is_retired: { type: boolean }

  responses:
    Unauthenticated:
      description: Missing, invalid or revoked token (UNAUTHENTICATED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Wrong role, policy denied (FORBIDDEN) or suspended account (ACCOUNT_SUSPENDED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: ALREADY_APPLIED, FEEDBACK_EXISTS, HIRING_REPORT_PENDING or HIRING_REPORT_CLOSED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: |
        VALIDATION_FAILED (with field `errors`), or a business rule: INVALID_STATUS_TRANSITION,
        POSTING_CLOSED, FEEDBACK_NOT_OPEN, REGISTRY_INVALID_REQUEST
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ValidationError'
              - $ref: '#/components/schemas/Error'
    RateLimited:
      description: RATE_LIMITED (Retry-After header set)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RegistryError:
      description: REGISTRY_UNAVAILABLE or REGISTRY_AUTH_FAILED (legacy SOAP registry)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------- enums (identical to SIA doc Appendix F)
    Role: { type: string, enum: [candidate, employer, admin] }
    RegistryType: { type: string, enum: [DTI, SEC] }
    RegistryStatus: { type: string, enum: [ACTIVE, EXPIRED, CANCELLED, NOT_FOUND, ERROR] }
    AccommodationGroup: { type: string, enum: [physical_access, communication, work_arrangement, assistive_technology, support] }
    EmploymentType: { type: string, enum: [full_time, part_time, contract, internship] }
    WorkSetup: { type: string, enum: [onsite, hybrid, remote] }
    InterviewFormat: { type: string, enum: [online, onsite] }
    JobPostingStatus:
      type: string
      enum: [draft, open, closed]
      description: No approval step since Decision 2026-10-21 (`pending_approval` rows were migrated).
    EducationLevel:
      type: string
      enum: [elementary, high_school, senior_high, vocational, college, postgraduate]
      description: In order; a level meets every requirement at or below it.
    ApplicationStatus:
      type: string
      enum: [pending, reviewed, shortlisted, contacted, hired, rejected, withdrawn]
      description: >-
        Shown as Submitted, Under review, Shortlisted, Contacted, Hired, Not selected, Withdrawn (Decision 2026-10-22b).
        "Job closed" is not a status: see Application.job_closed.
    HiringParty: { type: string, enum: [employer, candidate] }
    HiringReport:
      type: object
      description: One hiring report and its answers (Decision 2026-10-22b); only roles, never who at the company answered
      properties:
        id: { type: integer }
        reported_by: { $ref: '#/components/schemas/HiringParty' }
        start_date: { type: string, format: date, description: The proposed start date (a "Not yet" answer may have changed it) }
        status: { type: string, enum: [pending, confirmed, disputed, cancelled] }
        can_respond: { type: boolean, description: 'True for the party that has to answer while it is pending' }
        created_at: { type: string, format: date-time }
        responded_at: { type: [string, 'null'], format: date-time, description: When it was confirmed, disputed or cancelled }
        events:
          type: array
          description: Oldest first
          items:
            type: object
            properties:
              actor_role: { $ref: '#/components/schemas/HiringParty' }
              action: { type: string, enum: [reported, confirmed, not_yet, disputed, cancelled] }
              start_date: { type: [string, 'null'], format: date, description: 'reported: the proposed date; not_yet: the new date, if one was given' }
              created_at: { type: string, format: date-time }
    FeedbackRating:
      type: string
      enum: [delivered, partial, not_delivered]
      description: Values 1 / 0.5 / 0 in the trust score formula
    ReportStatus: { type: string, enum: [open, dismissed, actioned] }
    SourceStatus: { type: string, enum: [ok, cached, stale, unavailable] }
    ErrorCode:
      type: string
      enum:
        - BAD_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - ACCOUNT_SUSPENDED
        - NOT_FOUND
        - ALREADY_APPLIED
        - FEEDBACK_EXISTS
        - VALIDATION_FAILED
        - INVALID_STATUS_TRANSITION
        - POSTING_CLOSED
        - PROFILE_INCOMPLETE
        - RESUME_REQUIRED
        - HIRING_REPORT_PENDING
        - HIRING_REPORT_CLOSED
        - FEEDBACK_NOT_OPEN
        - REGISTRY_INVALID_REQUEST
        - RATE_LIMITED
        - SERVER_ERROR
        - REGISTRY_UNAVAILABLE
        - REGISTRY_AUTH_FAILED
        - UPSTREAM_ERROR
        - SERVICE_UNAVAILABLE
        - UPSTREAM_TIMEOUT

    # ---------- errors
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            request_id: { type: string, format: uuid }
    ValidationError:
      type: object
      required: [message, error, errors]
      properties:
        message: { type: string, example: The given data was invalid. }
        error:
          type: object
          properties:
            code: { type: string, const: VALIDATION_FAILED }
            request_id: { type: string, format: uuid }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    # ---------- common
    PageMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer, const: 12 }
        total: { type: integer }
        last_page: { type: integer }
    ServiceHealth: { type: string, enum: [up, down] }
    Location:
      type: object
      properties:
        psgc_code: { type: [string, 'null'] }
        label: { type: [string, 'null'], example: 'Quezon City, NCR' }
    LocationItem:
      type: object
      properties:
        code: { type: string, pattern: '^\d{10}$', description: 'Official 10-digit PSGC code', example: '1381300000' }
        name: { type: string }
        level: { type: string, enum: [region, province, city, municipality] }

    # ---------- users and profiles
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        is_active: { type: boolean }
    Account:
      description: The signed-in user's own account (login, register, GET /me). Admin user lists use User, without these settings.
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            display_prefs:
              description: null until the user saves them once
              oneOf:
                - $ref: '#/components/schemas/DisplayPrefs'
                - type: 'null'
            email_notifications:
              type: boolean
              description: Notifications are also emailed (default true; PUT /me/email-notifications). Not used for administrators.
            onboarding:
              description: Welcome tour and "Get started" list (PATCH /me/onboarding); null for administrators.
              oneOf:
                - $ref: '#/components/schemas/Onboarding'
                - type: 'null'
            profile_complete:
              type: [boolean, 'null']
              description: Job seekers only (null for others) – false until the required profile fields are filled in (Decision 2026-10-21)
    Onboarding:
      type: object
      required: [tour_done, checklist_hidden]
      properties:
        tour_done: { type: boolean, description: The welcome tour was finished or skipped }
        checklist_hidden: { type: boolean, description: The user hid the dashboard's "Get started" list }
    DisplayPrefs:
      type: object
      required: [text_size, contrast, motion]
      properties:
        text_size: { type: string, enum: ['100', '125', '150'], description: Text size in percent }
        contrast: { type: string, enum: [normal, high] }
        motion: { type: string, enum: [normal, reduce] }
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/Account' }
    CandidateProfileInput:
      type: object
      properties:
        headline: { type: [string, 'null'], maxLength: 255 }
        skills:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 50 }
        experience: { type: [string, 'null'], maxLength: 5000 }
        education_level:
          oneOf:
            - $ref: '#/components/schemas/EducationLevel'
            - type: 'null'
        experience_years: { type: [integer, 'null'], minimum: 0, maximum: 60 }
        preferred_work_setups:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { $ref: '#/components/schemas/WorkSetup' }
        preferred_employment_types:
          type: array
          maxItems: 4
          uniqueItems: true
          items: { $ref: '#/components/schemas/EmploymentType' }
        location_psgc: { type: [string, 'null'], pattern: '^\d{9,10}$' }
        location_label: { type: [string, 'null'], maxLength: 255, description: 'Display label chosen with the PSGC picker, e.g. "Quezon City, National Capital Region (NCR)"; returned as location.label' }
        disability_type: { type: [string, 'null'], maxLength: 100, description: Optional; never used for matching }
        show_disability: { type: boolean, default: false }
    CandidateProfile:
      allOf:
        - $ref: '#/components/schemas/CandidateProfileInput'
        - type: object
          properties:
            id: { type: integer }
            location: { $ref: '#/components/schemas/Location' }
            resume_url: { type: [string, 'null'], description: 'Signed gateway link to GET /resumes/{id}, valid 30 minutes; null without a résumé' }
            profile_complete: { type: boolean, description: 'Location, at least 3 skills, education level, at least one preferred work setup and employment type (Decision 2026-10-21)' }
            profile_missing:
              type: array
              description: The required fields still empty, in this order
              items: { type: string, enum: [location_psgc, skills, education_level, preferred_work_setups, preferred_employment_types] }
            accommodations:
              type: array
              items: { $ref: '#/components/schemas/Accommodation' }
    CompanyInput:
      type: object
      required: [company_name, business_reg_no, registry_type, industry, address]
      properties:
        company_name: { type: string }
        business_reg_no: { type: string }
        registry_type: { $ref: '#/components/schemas/RegistryType' }
        industry: { type: string }
        address: { type: string }
        location_psgc: { type: [string, 'null'], pattern: '^\d{9,10}$' }
        location_label: { type: [string, 'null'], maxLength: 255, description: 'Display label chosen with the PSGC picker, e.g. "Quezon City, National Capital Region (NCR)"; returned as location.label' }
        description: { type: [string, 'null'], maxLength: 2000 }
        logo: { type: string, format: binary, description: 'PNG, JPG or WebP, max 2 MB' }
    Company:
      allOf:
        - $ref: '#/components/schemas/EmployerPublic'
        - type: object
          properties:
            business_reg_no: { type: string }
            registry_type: { $ref: '#/components/schemas/RegistryType' }
            verified_at: { type: [string, 'null'], format: date-time }
            verification_rejected_reason: { type: [string, 'null'] }
    EmployerSummary:
      type: object
      properties:
        id: { type: integer }
        company_name: { type: string }
        verified: { type: boolean }
    EmployerPublic:
      allOf:
        - $ref: '#/components/schemas/EmployerSummary'
        - type: object
          properties:
            industry: { type: string }
            address: { type: string }
            location: { $ref: '#/components/schemas/Location' }
            description: { type: [string, 'null'] }
            logo_url: { type: [string, 'null'], description: 'Gateway URL of GET /employers/{id}/logo (built from PUBLIC_API_URL)' }
            trust_score: { $ref: '#/components/schemas/TrustScoreSummary' }
    RegistryResult:
      type: object
      properties:
        status: { $ref: '#/components/schemas/RegistryStatus' }
        registered_name: { type: [string, 'null'] }
        name_match: { type: [number, 'null'], minimum: 0, maximum: 1, description: 'null for NOT_FOUND and ERROR; below 0.80 is highlighted' }
        checked_at: { type: string, format: date-time }

    # ---------- master data
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    Accommodation:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        group: { $ref: '#/components/schemas/AccommodationGroup' }
        description: { type: [string, 'null'] }
        is_retired: { type: boolean }
        note: { type: [string, 'null'], description: Only on a posting's accommodations }

    # ---------- postings
    JobPostingInput:
      type: object
      required: [title, description, category_id, address, employment_type, work_setup, interview_format, closes_at, accommodations]
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: string }
        skills:
          type: array
          maxItems: 20
          description: Skills the job needs; at least one to publish (submit true)
          items: { type: string, maxLength: 50 }
        education_level:
          description: Minimum education, or null for none
          oneOf:
            - $ref: '#/components/schemas/EducationLevel'
            - type: 'null'
        experience_years: { type: [integer, 'null'], minimum: 0, maximum: 40, description: Minimum years of experience }
        qualifications: { type: [string, 'null'], maxLength: 2000, description: 'Other qualifications in words (licences, certificates)' }
        category_id: { type: integer }
        address: { type: string }
        location_psgc: { type: [string, 'null'] }
        location_label: { type: [string, 'null'], maxLength: 255, description: 'Display label chosen with the PSGC picker, e.g. "Quezon City, National Capital Region (NCR)"; returned as location.label' }
        employment_type: { $ref: '#/components/schemas/EmploymentType' }
        work_setup: { $ref: '#/components/schemas/WorkSetup' }
        interview_format: { $ref: '#/components/schemas/InterviewFormat' }
        closes_at: { type: string, format: date }
        accommodations:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: integer }
              note: { type: [string, 'null'], maxLength: 255 }
        submit: { type: boolean, description: 'true = publish now (verified company only); false = save as draft' }
    Match:
      type: object
      description: >-
        MatchingService (Decision 2026-10-21): score 0–100 from skills (weight 40), location (20: remote or same city 1, same
        province 0.6, same region 0.3, else 0), qualifications (15), work preferences (10) and accommodation needs (15, only
        with saved needs). Parts without data on either side are left out and the rest re-weighted. Labels: strong ≥ 80,
        good ≥ 60, fair ≥ 40, else low.
      properties:
        score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        label: { type: [string, 'null'], enum: [strong, good, fair, low, null] }
        met: { type: integer, description: Accommodation needs the posting offers }
        total: { type: integer, description: The candidate's needs (0 without needs) }
        missing:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
        skills:
          type: object
          properties:
            matched: { type: array, items: { type: string }, description: The posting's skills the candidate has }
            missing: { type: array, items: { type: string } }
        location:
          type: object
          properties:
            tier: { type: string, enum: [remote, same_city, same_province, same_region, farther, unknown] }
            distance_km: { type: [number, 'null'], description: City centre to city centre; one decimal below 10 km }
        education:
          type: object
          properties:
            required: { oneOf: [{ $ref: '#/components/schemas/EducationLevel' }, { type: 'null' }] }
            met: { type: [boolean, 'null'], description: null when nothing is required }
        experience:
          type: object
          properties:
            required_years: { type: [integer, 'null'] }
            met: { type: [boolean, 'null'] }
        preferences:
          type: object
          properties:
            work_setup: { type: [boolean, 'null'], description: null when the candidate chose none }
            employment_type: { type: [boolean, 'null'] }
    TrustScoreSummary:
      type: object
      properties:
        published: { type: boolean }
        score: { type: [integer, 'null'], minimum: 0, maximum: 100, description: Whole percentage; null below 3 responses }
        based_on: { type: integer }
    TrustScore:
      allOf:
        - $ref: '#/components/schemas/TrustScoreSummary'
        - type: object
          properties:
            breakdown:
              type: array
              items:
                type: object
                properties:
                  accommodation_id: { type: integer }
                  name: { type: string }
                  delivered: { type: integer }
                  partial: { type: integer }
                  not_delivered: { type: integer }
                  of: { type: integer }
    JobPosting:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        skills: { type: array, items: { type: string } }
        education_level: { oneOf: [{ $ref: '#/components/schemas/EducationLevel' }, { type: 'null' }] }
        experience_years: { type: [integer, 'null'] }
        qualifications: { type: [string, 'null'] }
        employer: { $ref: '#/components/schemas/EmployerSummary' }
        category: { $ref: '#/components/schemas/Category' }
        address: { type: string }
        location: { $ref: '#/components/schemas/Location' }
        employment_type: { $ref: '#/components/schemas/EmploymentType' }
        work_setup: { $ref: '#/components/schemas/WorkSetup' }
        interview_format: { $ref: '#/components/schemas/InterviewFormat' }
        status: { $ref: '#/components/schemas/JobPostingStatus' }
        closes_at: { type: string, format: date }
        accommodations:
          type: array
          items: { $ref: '#/components/schemas/Accommodation' }
        match:
          description: Only for logged-in candidates with a profile (search, details, saved jobs); null otherwise. `missing` lists the unmet needs by name.
          oneOf:
            - $ref: '#/components/schemas/Match'
            - type: 'null'
        trust_score: { $ref: '#/components/schemas/TrustScoreSummary' }
        rejection_reason: { type: [string, 'null'], description: Only for the owning employer and admins }
        applicants_count: { type: integer, description: 'Only in GET /employer/job-postings (owner)' }
        saved:
          type: boolean
          description: Only for logged-in candidates – in search results (GET /job-postings), GET /job-postings/{id}, the saved-jobs list and the save response (M12)
        my_application:
          description: Only in GET /job-postings/{id} for a logged-in candidate – their application to this posting, or null
          oneOf:
            - type: object
              properties:
                id: { type: integer }
                status: { $ref: '#/components/schemas/ApplicationStatus' }
                created_at: { type: string, format: date-time }
            - type: 'null'
        created_at: { type: string, format: date-time }

    # ---------- applications
    Application:
      type: object
      properties:
        id: { type: integer }
        job_posting: { $ref: '#/components/schemas/JobPosting' }
        job_posting_id: { type: integer }
        candidate:
          description: Only for the employer that owns the posting (absent for the candidate)
          type: object
          properties:
            name: { type: string }
            headline: { type: [string, 'null'] }
            skills: { type: array, items: { type: string } }
            experience: { type: [string, 'null'] }
            education_level: { oneOf: [{ $ref: '#/components/schemas/EducationLevel' }, { type: 'null' }] }
            experience_years: { type: [integer, 'null'] }
            accommodations:
              type: array
              items: { $ref: '#/components/schemas/Accommodation' }
            disability_type: { type: [string, 'null'], description: Only when the candidate chose show_disability; otherwise null }
            resume_url: { type: [string, 'null'], description: 'Signed gateway link to GET /resumes/{id}, valid 30 minutes' }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        cover_note: { type: [string, 'null'] }
        interview_request: { type: [string, 'null'] }
        reviewed_at: { type: [string, 'null'], format: date-time, description: 'When the employer first reviewed it (set by pending → reviewed); null before, and for applications reviewed before 2026-10-13 that have moved on' }
        shortlisted_at: { type: [string, 'null'], format: date-time, description: When the employer shortlisted it (null if skipped) }
        contacted_at: { type: [string, 'null'], format: date-time, description: When the employer marked that they reached out (null if skipped) }
        hired_at: { type: [string, 'null'], format: date-time, description: When the hire was confirmed }
        hire_start_date: { type: [string, 'null'], format: date, description: The confirmed start date }
        job_closed: { type: boolean, description: 'Still in progress while the posting is closed or deleted ("Job closed"); the stage is kept and a hire can still be reported' }
        hiring_reports:
          type: array
          description: Hiring confirmation history, oldest first
          items: { $ref: '#/components/schemas/HiringReport' }
        feedback_opens_on: { type: [string, 'null'], format: date, description: 'Calendar day 30 after hire_start_date (Asia/Manila); null until the hire is confirmed' }
        feedback_submitted: { type: boolean, description: 'Only for the candidate (feedback is anonymous to employers): the candidate has rated this job' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ---------- notifications and moderation
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [application_received, application_status_changed, hiring_report, employer_verification, posting_review, feedback_reminder]
          description: |
            application_received (to the employer), application_status_changed (to the party that did not act),
            hiring_report (a new report to the party that has to answer, each answer to the reporter; data.application_id,
            data.hiring_report_id, data.action – a cancelled report sends none),
            employer_verification (admin approved/rejected the company; data.verified),
            posting_review (admin removed a posting, with the reason; data.job_posting_id, data.removed true – no approvals since Decision 2026-10-21),
            feedback_reminder (to a hired candidate on the day the feedback form opens; data.application_id).
            Each one is also emailed when the user's email_notifications is on.
          example: application_status_changed
        data:
          type: object
          additionalProperties: true
          properties:
            message: { type: string, description: Plain-language text shown to the user }
            url: { type: string, description: 'Optional in-app path, e.g. /candidate/applications/11' }
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    Report:
      type: object
      properties:
        id: { type: integer }
        job_posting_id: { type: integer }
        job_posting:
          description: Included in admin lists
          type: object
          properties:
            id: { type: integer }
            title: { type: string }
            employer: { $ref: '#/components/schemas/EmployerSummary' }
        reason: { type: string }
        status: { $ref: '#/components/schemas/ReportStatus' }
        note:
          description: Admin only – the note recorded when resolving
          type: [string, 'null']
        resolved_at:
          description: Admin only
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time }

    # ---------- administration
    AdminEmployer:
      allOf:
        - $ref: '#/components/schemas/Company'
        - type: object
          properties:
            owner:
              type: object
              properties:
                id: { type: integer }
                name: { type: string }
                email: { type: string, format: email }
            latest_registry_check:
              oneOf:
                - $ref: '#/components/schemas/RegistryResult'
                - type: 'null'
    AdminFeedback:
      type: object
      description: One anonymous feedback response (no candidate data)
      properties:
        id: { type: integer }
        employer: { $ref: '#/components/schemas/EmployerSummary' }
        job_title: { type: string }
        is_hidden: { type: boolean }
        comments: { type: [string, 'null'] }
        items:
          type: array
          items:
            type: object
            properties:
              accommodation_id: { type: integer }
              name: { type: string }
              rating: { $ref: '#/components/schemas/FeedbackRating' }
        created_at: { type: string, format: date-time }

    # ---------- dashboards (M8)
    ApplicationCounts:
      type: object
      description: Number of applications per ApplicationStatus
      properties:
        pending: { type: integer }
        reviewed: { type: integer }
        shortlisted: { type: integer }
        contacted: { type: integer }
        hired: { type: integer }
        rejected: { type: integer }
        withdrawn: { type: integer }
    ApplicationPipeline:
      type: object
      description: >-
        The stage tiles (Decision 2026-10-22b). An application in progress whose job closed counts under
        closed, not under its stage; hiring_pending (a report waiting for an answer) overlaps the stages;
        hired = confirmed hires.
      properties:
        submitted: { type: integer }
        under_review: { type: integer }
        shortlisted: { type: integer }
        contacted: { type: integer }
        hiring_pending: { type: integer }
        hired: { type: integer }
        closed: { type: integer, description: Not selected + withdrawn + job closed }
    PostingCounts:
      type: object
      description: Number of postings per JobPostingStatus
      properties:
        draft: { type: integer }
        open: { type: integer }
        closed: { type: integer }
    CandidateDashboard:
      type: object
      properties:
        applications: { $ref: '#/components/schemas/ApplicationCounts' }
        pipeline: { $ref: '#/components/schemas/ApplicationPipeline' }
        needs_count: { type: integer, description: Saved accommodation needs }
        matching_jobs: { type: integer, description: Open postings that meet all saved needs }
        feedback_due:
          type: array
          items:
            type: object
            properties:
              application_id: { type: integer }
              job_title: { type: string }
              company_name: { type: string }
              opens_on: { type: string, format: date }
              is_open: { type: boolean }
    EmployerDashboard:
      type: object
      properties:
        company:
          type: object
          properties:
            exists: { type: boolean }
            verified: { type: boolean }
            verification_rejected_reason: { type: [string, 'null'] }
        postings: { $ref: '#/components/schemas/PostingCounts' }
        applications: { $ref: '#/components/schemas/ApplicationCounts' }
        pipeline: { $ref: '#/components/schemas/ApplicationPipeline' }
        trust_score: { $ref: '#/components/schemas/TrustScoreSummary' }
    AdminDashboard:
      type: object
      properties:
        users:
          type: object
          properties:
            candidate: { type: integer }
            employer: { type: integer }
            admin: { type: integer }
            suspended: { type: integer }
        postings: { $ref: '#/components/schemas/PostingCounts' }
        applications: { $ref: '#/components/schemas/ApplicationCounts' }
        verification_queue: { type: integer, description: Employers waiting for verification }
        open_reports: { type: integer }
        feedback:
          type: object
          properties:
            responses: { type: integer }
            hidden: { type: integer }
        published_trust_scores: { type: integer, description: Employers with at least 3 responses }

    # ---------- insights
    NearbyPlace:
      type: object
      properties:
        name: { type: [string, 'null'] }
        wheelchair: { type: string, enum: ['yes', limited] }
        distance_m: { type: integer }
    Snapshot:
      type: object
      properties:
        job_posting_id: { type: integer }
        location:
          type: object
          properties:
            psgc_code: { type: [string, 'null'] }
            label: { type: [string, 'null'] }
            lat: { type: [number, 'null'] }
            lon: { type: [number, 'null'] }
            precision: { type: [string, 'null'], enum: [street, city, null] }
        employer_claims:
          type: object
          description: Advertised accommodation names keyed by group
          additionalProperties:
            type: array
            items: { type: string }
        community_verification:
          description: null when the trust score is not published
          oneOf:
            - type: object
              properties:
                trust_score: { type: integer }
                based_on: { type: integer }
                breakdown:
                  type: array
                  items: { type: object, additionalProperties: true }
            - type: 'null'
        nearby_accessible:
          oneOf:
            - type: object
              properties:
                radius_m: { type: integer, const: 500 }
                transit_stops: { type: array, items: { $ref: '#/components/schemas/NearbyPlace' } }
                toilets: { type: array, items: { $ref: '#/components/schemas/NearbyPlace' } }
                parking: { type: array, items: { $ref: '#/components/schemas/NearbyPlace' } }
                other: { type: array, items: { $ref: '#/components/schemas/NearbyPlace' } }
            - type: 'null'
        sources:
          type: object
          properties:
            core: { $ref: '#/components/schemas/SourceStatus' }
            psgc: { $ref: '#/components/schemas/SourceStatus' }
            nominatim: { $ref: '#/components/schemas/SourceStatus' }
            overpass: { $ref: '#/components/schemas/SourceStatus' }
        disclaimer: { type: string }
        generated_at: { type: string, format: date-time }
    InternalPostingSummary:
      type: object
      properties:
        id: { type: integer }
        address: { type: string }
        psgc_code: { type: [string, 'null'] }
        location_label: { type: [string, 'null'], description: Label stored with the PSGC code (fallback when PSGC is unavailable) }
        accommodations:
          type: array
          description: Advertised accommodations, sorted by name
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              group: { $ref: '#/components/schemas/AccommodationGroup' }
        trust_score:
          description: Same as the public trust score; breakdown is empty until published
          $ref: '#/components/schemas/TrustScore'
